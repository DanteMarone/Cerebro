<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cerebro v2</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- hooks.module.js is the unmodified upstream artifact and imports the bare specifier
         "preact". An import map resolves it without altering the vendored bytes. -->
    <script type="importmap">
    {
      "imports": {
        "preact": "/static/vendor/preact.module.js",
        "preact/hooks": "/static/vendor/hooks.module.js"
      }
    }
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
